apiVersion: yggdrasil.io/v1alpha1
kind: capability
metadata:
  name: ensure-webhook-endpoint
  namespace: global
spec:
  type_ref: { namespace: global, name: stripe }
  operation: ensure_webhook_endpoint
  description: |
    Adopt one existing Stripe WebhookEndpoint by exact id or URL and reconcile
    its mutable state. This capability never creates an endpoint because Stripe
    returns the signing secret only once. Use provision_webhook_endpoint from a
    workflow with a transient secret sink when the endpoint is absent.
  inputs:
    id: { type: string, description: "Exact endpoint ID. When absent, exact URL adoption is used." }
    url: { type: string }
    enabled_events:
      type: array
      items: { type: string }
    disabled: { type: boolean, description: "Desired disabled state. Set false to re-enable." }
    description: { type: string }
    metadata: { type: object }
    connect: { type: boolean, description: "Required explicit endpoint scope. Ownership metadata must match scope and integration instance." }
    stripe_account: { type: string }
    idempotency_key: { type: string }
  outputs:
    id: { type: string }
    url: { type: string }
    status: { type: string }
    enabled_events: { type: array }
    api_version: { type: string }
    application: { type: string }
    livemode: { type: boolean }
    created_at: { type: integer }
    description: { type: string }
    metadata: { type: object }
    scope: { type: string }
    stripe_account: { type: string }
    adopted: { type: boolean }
    created: { type: boolean }
    updated: { type: boolean }
